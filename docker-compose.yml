services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vault_user:vault_pass@db:5432/vault_db
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: vault_minio
      S3_SECRET_KEY: vault_minio_secret
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_pass
      POSTGRES_DB: vault_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d vault_db"]
      interval: 2s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vault_minio
      MINIO_ROOT_PASSWORD: vault_minio_secret
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - storage_data:/data

volumes:
  db_data:
  storage_data:
