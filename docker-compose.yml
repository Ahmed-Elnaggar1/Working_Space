services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vault_postgres
    restart: always
    environment:
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_pass
      POSTGRES_DB: vault_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d vault_db"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: vault_backend
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: vault_frontend
    restart: on-failure
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume so the host's node_modules doesn't overwrite the container's alpine modules
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
